<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CodeNInspire</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }
    html, body {
      height: 100%;
      width: 100%;
    }
    body {
      background: url('https://wallpapers.com/images/featured/aesthetic-book-desktop-wv3k504hp9qzsi3i.jpg') center/cover no-repeat fixed;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .overlay {
      background: rgba(0, 0, 0, 0.7);
      padding: 40px 30px;
      border-radius: 20px;
      text-align: center;
      max-width: 600px;
      width: 90%;
      animation: fadeIn 1s ease-out;
    }
    h1 {
      font-size: 36px;
      color: #cca279;
      margin-bottom: 15px;
    }
    p {
      font-size: 18px;
      color: #ddd;
      margin-bottom: 25px;
    }
    .main-btn {
      background: #cca279;
      color: #000;
      padding: 12px 30px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
      transition: background 0.3s ease;
      display: inline-block;
    }
    .main-btn:hover {
      background: #00b5cc;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 600px) {
      h1 { font-size: 28px; }
      p { font-size: 16px; }
    }
  </style>
</head>
<body>
  <div class="overlay">
    <h1>CodeNInspire</h1>
    <p>Where Coding Meets Stories & Inspiration</p>
    <a href="topics.html" class="main-btn">Get Started</a>
  </div>
</body>
</html>
